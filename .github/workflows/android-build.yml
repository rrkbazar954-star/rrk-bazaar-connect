
name: RRK Bazaar Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web app
        run: npm run build

      - name: Create Capacitor entry file
        run: |
          mkdir -p .output/public
          echo '<!doctype html><html><head><meta charset="utf-8"><title>RRK Bazaar</title></head><body></body></html>' > .output/public/index.html

      - name: Show web output
        run: |
          echo "Checking generated files..."
          cat capacitor.config.json
          ls -la .output/public
          find .output/public -maxdepth 2 -type f -print

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug

      - name: Save APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: RRK-Bazaar-Android-Files
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
